name: Build Project SM iOS IPA

on:
  workflow_dispatch:
    inputs:
      distribution_method:
        description: "ad-hoc = install on registered iPhones; app-store = upload to TestFlight"
        required: true
        default: ad-hoc
        type: choice
        options:
          - ad-hoc
          - app-store

permissions:
  contents: read

jobs:
  build-ios-ipa:
    runs-on: macos-latest
    env:
      BUNDLE_ID: com.example.projectSmMobile
      PROJECT_SM_URL: https://project-sm-web.onrender.com
    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get app packages
        working-directory: mobile
        run: flutter pub get

      # These values are supplied only through GitHub Actions Secrets.
      # Never put Apple certificates or passwords into this file.
      - name: Import Apple signing certificate
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          pathlib.Path(os.environ['RUNNER_TEMP'], 'certificate.p12').write_bytes(
              base64.b64decode(os.environ['IOS_CERTIFICATE_BASE64'])
          )
          PY
          security create-keychain -p "$IOS_KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" build.keychain
          security import "$RUNNER_TEMP/certificate.p12" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k build.keychain
          security list-keychain -d user -s build.keychain

      - name: Install provisioning profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          profile = pathlib.Path.home() / 'Library/MobileDevice/Provisioning Profiles/project-sm.mobileprovision'
          profile.parent.mkdir(parents=True, exist_ok=True)
          profile.write_bytes(base64.b64decode(os.environ['IOS_PROVISIONING_PROFILE_BASE64']))
          PY

      - name: Configure signing and IPA export
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
          DISTRIBUTION_METHOD: ${{ inputs.distribution_method }}
        working-directory: mobile
        run: |
          python3 - <<'PY'
          import os
          path = 'ios/Runner.xcodeproj/project.pbxproj'
          source = open(path, encoding='utf-8').read()
          marker = 'PRODUCT_BUNDLE_IDENTIFIER = com.example.projectSmMobile;'
          settings = marker + "\n\t\t\t\tDEVELOPMENT_TEAM = %s;\n\t\t\t\tCODE_SIGN_STYLE = Manual;\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = %s;" % (
              os.environ['APPLE_TEAM_ID'], os.environ['IOS_PROVISIONING_PROFILE_NAME'])
          open(path, 'w', encoding='utf-8').write(source.replace(marker, settings))
          PY
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>${DISTRIBUTION_METHOD}</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>provisioningProfiles</key><dict>
              <key>com.example.projectSmMobile</key><string>${IOS_PROVISIONING_PROFILE_NAME}</string>
            </dict>
          </dict></plist>
          EOF

      - name: Build signed IPA
        working-directory: mobile
        run: flutter build ipa --release --export-options-plist=ios/ExportOptions.plist --dart-define=PROJECT_SM_URL="$PROJECT_SM_URL"

      - name: Save IPA for download
        uses: actions/upload-artifact@v4
        with:
          name: Project-SM-iOS-IPA-${{ inputs.distribution_method }}
          path: mobile/build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14
